name: Setup Node and npm
description: Setup Node and pin npm from package.json packageManager

inputs:
  node-version:
    description: Node.js version override; defaults to the Dockerfile base image's version
    default: ""
  firewall-token:
    description: Auth token for the DepthFirst dependency firewall npm registry; only pass this where the secret is guaranteed available (no pull_request trigger)
    default: ""

outputs:
  node-version:
    description: Installed Node.js version
    value: ${{ steps.node.outputs.node-version }}

runs:
  using: composite
  steps:
    - name: Resolve Node version
      id: node-version
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        version="$REQUESTED_NODE_VERSION"
        if [ -z "$version" ]; then
          image="$(awk '$1 == "FROM" && $2 ~ /^node:/ { print $2; exit }' Dockerfile)"
          if [ -z "$image" ]; then
            echo "No Node base image found in Dockerfile" >&2
            exit 1
          fi
          version="$(docker run --rm --pull=always "$image" node -p process.versions.node)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Configure DepthFirst dependency firewall
      shell: bash
      env:
        FIREWALL_TOKEN: ${{ inputs.firewall-token }}
      run: |
        if [ -n "$FIREWALL_TOKEN" ]; then
          {
            echo "registry=https://firewall.depthfirst.com/npm/"
            echo "//firewall.depthfirst.com/npm/:_authToken=${FIREWALL_TOKEN}"
          } >> ~/.npmrc
        fi

    - name: Set up Node
      id: node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ steps.node-version.outputs.version }}

    - name: Pin npm
      shell: bash
      run: node scripts/ensure-npm-version.cjs
